name: Telegrios Build

# One-click build of the Telegrios mod APK (v2.0) from OFFICIAL Telegram sources:
#   1) clone https://github.com/TelegramMessenger/Telegram-Android (shallow, with submodules)
#   2) install NDK + CMake, apply the Telegrios overlay
#      (package org.telegrios.messenger, Telegram-style icons, 3 themes,
#       Ghost Mode hooks, "Telegrios Settings" entry)
#   3) sign with the repo secrets (recommended) or with the keystore committed
#      in the official tree (placeholder creds, still stable between runs)
#   4) assemble the arm64-v8a release APK
#
# Optional repo secrets for a STABLE signing key (recommended):
#   ANDROID_KEYSTORE_B64  — base64-encoded .jks/.p12 keystore
#   ANDROID_KEYSTORE_PASS — keystore password
#   ANDROID_KEY_ALIAS     — key alias (e.g. telegrios)
#   ANDROID_KEY_PASS      — key password

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'APK variant'
        required: false
        default: 'release'
        type: choice
        options: [release, debug]
  push:
    branches: [ main, master ]
    paths: [ 'overlay/**', '.github/workflows/spectra-build.yml' ]

concurrency:
  group: telegrios-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout Telegrios overlay
        uses: actions/checkout@v4

      - name: Clone official Telegram-Android (shallow, with submodules)
        run: |
          git clone --depth 1 --recurse-submodules -j8 https://github.com/TelegramMessenger/Telegram-Android.git telegram
          echo "TELEGRAM_COMMIT=$(git -C telegram rev-parse HEAD)" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK 27.2.12479018 + CMake 3.22.1
        run: |
          echo "y" | sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1" --sdk_root="$ANDROID_HOME" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > telegram/local.properties

      - name: Apply Telegrios overlay
        run: |
          python3 -m pip install --quiet pillow
          python3 overlay/tools/apply_overlay.py --repo "$GITHUB_WORKSPACE/telegram"

      - name: Prepare signing keystore (secrets, or the committed placeholder)
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          KS=telegram/TMessagesProj/config/release.keystore
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$KS"
            {
              echo "RELEASE_STORE_PASSWORD=$ANDROID_KEYSTORE_PASS"
              echo "RELEASE_KEY_ALIAS=${ANDROID_KEY_ALIAS:-telegrios}"
              echo "RELEASE_KEY_PASSWORD=${ANDROID_KEY_PASS:-$ANDROID_KEYSTORE_PASS}"
            } >> telegram/gradle.properties
            echo "Signing with the keystore from repo secrets (stable signature)."
          else
            echo "::notice::No ANDROID_KEYSTORE_B64 secret - the build is signed with the keystore committed in the official tree (creds: android/androidkey). This is still stable between runs; add your own keystore as secrets to keep one signature across rebuilds."
          fi

      - name: Build APK (arm64-v8a)
        working-directory: telegram
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}
        run: |
          set -o pipefail
          if [ "$BUILD_TYPE" = "debug" ]; then
            TASK=:TMessagesProj_App:assembleAfatDebug
          else
            TASK=:TMessagesProj_App:assembleAfatRelease
          fi
          echo "Building $TASK ..."
          ./gradlew "$TASK" --build-cache --no-configuration-cache 2>&1 | tee build.log

      - name: Verify the APK exists and contains native libraries
        run: |
          APK=$(find telegram/TMessagesProj_App/build/outputs/apk -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No APK produced by the build"
            exit 1
          fi
          if ! unzip -l "$APK" | grep -q "lib/arm64-v8a/libtmessages"; then
            echo "::error::$APK has no native libraries (lib/arm64-v8a) - such an APK would crash at startup"
            unzip -l "$APK" | grep "lib/" | head -10 || true
            exit 1
          fi
          echo "Native libs OK in $(basename "$APK"):"
          unzip -l "$APK" | grep "lib/arm64-v8a/" | head -10
          echo "APK_PATH=$APK" >> $GITHUB_ENV

      - name: Collect artifacts
        run: |
          mkdir -p out
          TYPE=${{ github.event.inputs.build_type || 'release' }}
          cp "$APK_PATH" "out/Telegrios-v2.0-${TYPE}-arm64.apk"
          ls -la out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegrios-APK
          path: out/*.apk
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Telegrios-build-log
          path: telegram/build.log
          if-no-files-found: ignore
